name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and worker tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck dash

      - name: shellcheck
        run: shellcheck -s sh root/usr/libexec/yandex-speedtest/worker .github/scripts/*.sh tests/*.sh tests/e2e/run.sh

      - name: JavaScript syntax
        run: |
          for f in $(find htdocs -name '*.js'); do
            node -e "new Function(require('fs').readFileSync('$f', 'utf8'))" && echo "ok $f"
          done

      - name: Worker tests
        run: dash tests/worker.sh

  build:
    name: OpenWrt ${{ matrix.release }} (${{ matrix.format }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '24.10'
            format: ipk
          - release: '25.12'
            format: apk

    steps:
      # the directory name becomes the package name in luci.mk
      - uses: actions/checkout@v6
        with:
          path: luci-app-yandex-speedtest

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget zstd

      - name: Download SDK
        run: |
          url=$(sh luci-app-yandex-speedtest/.github/scripts/openwrt-url.sh ${{ matrix.release }})
          sdk=$(curl -fsSL "$url/" | grep -oE 'openwrt-sdk-[^"]+\.tar\.(zst|xz)' | head -n1)
          echo "SDK: $url/$sdk"
          curl -fsSL "$url/$sdk" -o sdk.tar
          mkdir sdk
          tar -xf sdk.tar -C sdk --strip-components=1
          rm sdk.tar

      - name: Build package
        working-directory: sdk
        run: |
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base curl rpcd
          ln -s "$GITHUB_WORKSPACE/luci-app-yandex-speedtest" package/luci-app-yandex-speedtest
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-yandex-speedtest=m
          CONFIG_PACKAGE_luci-i18n-yandex-speedtest-ru=m
          # CONFIG_SIGNED_PACKAGES is not set
          EOF
          make defconfig
          make package/luci-app-yandex-speedtest/compile V=s -j"$(nproc)"

      - name: Collect packages
        run: |
          mkdir -p out
          find sdk/bin -type f -name "*yandex-speedtest*.${{ matrix.format }}" -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      - name: Show package contents
        run: |
          for f in out/*; do
            echo "== ${f#out/}"
            case "$f" in
            *.ipk) tar -xzOf "$f" ./data.tar.gz | tar -tvz ;;
            *.apk) sdk/staging_dir/host/bin/apk adbdump "$f" | grep -vE '^ *(hash|digest|unique-id):' | head -n 150 || true ;;
            esac
          done | tee contents.txt
          echo "::notice title=Package contents::$(sed -e 's/%/%25/g' contents.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')"

      - uses: actions/upload-artifact@v6
        with:
          name: luci-app-yandex-speedtest-${{ matrix.release }}-${{ matrix.format }}
          path: out/*

  e2e:
    name: E2E OpenWrt ${{ matrix.release }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '24.10'
            format: ipk
          - release: '25.12'
            format: apk
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: luci-app-yandex-speedtest-${{ matrix.release }}-${{ matrix.format }}
          path: pkgs

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run
        run: sh tests/e2e/run.sh ${{ matrix.release }} ${{ matrix.format }} pkgs

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.release }}
          path: tests/e2e/shots/
          if-no-files-found: ignore

  release:
    needs: [ test, build ]
    # vX.Y.Z tags -> release, pushes to the default branch -> "dev" pre-release
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/release.sh
